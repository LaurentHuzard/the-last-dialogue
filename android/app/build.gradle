plugins {
    id 'com.android.application'
}

android {
    namespace 'tv.octomue.thelastdialogue'
    compileSdk 35

    defaultConfig {
        applicationId 'tv.octomue.thelastdialogue'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1.0-archives'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Trusted https://appassets.androidplatform.net origin for local packaged assets.
    implementation 'androidx.webkit:webkit:1.12.1'
}
