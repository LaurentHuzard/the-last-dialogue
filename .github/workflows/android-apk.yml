name: Android debug APK

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write

jobs:
  apk:
    # Avoid executing arbitrary fork PR code with a write-capable GITHUB_TOKEN.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Test offline rules engine
        run: node --experimental-strip-types --test frontend/tests/offline-game.test.mjs
      - name: Build standalone Android web assets
        working-directory: frontend
        env:
          ANDROID_BUILD: '1'
          NEXT_PUBLIC_ANDROID_BUILD: '1'
          # No backend is baked into public APKs. LLM mode falls back transparently.
          NEXT_PUBLIC_API_URL: ''
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
      - name: Bundle the generated static site
        run: |
          test -s frontend/out/index.html
          mkdir -p android/app/src/main/assets/www
          cp -a frontend/out/. android/app/src/main/assets/www/
          test -d android/app/src/main/assets/www/_next
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Assemble Android debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK and checksum
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload installable APK to this PR run
        uses: actions/upload-artifact@v4
        with:
          name: the-last-dialogue-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish download link in PR discussion
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const tag = '<!-- last-dialogue-android-debug -->';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runId = context.runId;
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({ owner, repo, run_id: runId });
            const apk = artifacts.data.artifacts.find(item => item.name === 'the-last-dialogue-android-debug');
            const url = apk
              ? `https://github.com/${owner}/${repo}/actions/runs/${runId}/artifacts/${apk.id}`
              : `https://github.com/${owner}/${repo}/actions/runs/${runId}`;
            const body = `${tag}\n### 📱 APK Android de la PR\n\n` +
              `**[Télécharger la build debug](${url})** (GitHub Actions, connexion GitHub requise).\n\n` +
              `Cette APK inclut un **mode scénarisé réellement jouable hors ligne**, avec ses archives enregistrées sur le téléphone. ` +
              `Le mode LLM exige un backend distant et revient au mode sans LLM pour cette build autonome. ` +
              `Signature **debug temporaire** : désinstalle l'APK précédente si Android refuse la mise à jour. ` +
              `Aucun merge nécessaire.\n\nCommit : \`${context.sha.slice(0, 12)}\`.`;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const previous = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(tag));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
