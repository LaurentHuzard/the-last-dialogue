services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      CORS_ORIGINS: "http://localhost:3000"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      THE_LAST_DIALOGUE_MODEL: ${THE_LAST_DIALOGUE_MODEL:-gpt-4o-mini}
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:8080"
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8080"
    depends_on:
      - backend
